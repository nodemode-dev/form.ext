<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Beat Markers</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Beat Markers</h1>
        <div class="sub" id="sub">&nbsp;</div>
      </header>
      <label>Music clip <select id="clip"><option value="">Reading the timeline</option></select></label>
      <div class="row">
        <label class="grow">Sensitivity <input id="sensitivity" type="range" min="0.1" max="1" step="0.05" value="0.5" /></label>
        <label class="inline"><input id="bars" type="checkbox" /> Bars only</label>
      </div>
      <div class="row">
        <button class="primary" id="mark" type="button">Mark Beats</button>
      </div>
      <div id="status">&nbsp;</div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
