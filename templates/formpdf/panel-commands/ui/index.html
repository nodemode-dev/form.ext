<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Watermark</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Watermark</h1>
        <div class="sub" id="sub">&nbsp;</div>
      </header>
      <label>Words <input id="text" value="CONFIDENTIAL" /></label>
      <div class="row">
        <label>Colour <input id="color" type="color" value="#cc2222" /></label>
        <label class="grow">Angle <input id="angle" type="number" min="-90" max="90" value="45" /></label>
        <label class="grow">Opacity <input id="opacity" type="range" min="0.05" max="1" step="0.05" value="0.2" /></label>
      </div>
      <label>Pages, empty for all <input id="pages" placeholder="1-3, 5" /></label>
      <div class="row">
        <button class="primary" id="apply" type="button">Add Watermark</button>
      </div>
      <div id="status">&nbsp;</div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
