<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Notes Desk</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Notes Desk</h1>
        <div class="sub" id="sub">&nbsp;</div>
      </header>
      <ul class="list" id="slides"><li class="empty">Reading the deck</li></ul>
      <label id="label">Notes <textarea id="notes" rows="5" disabled></textarea></label>
      <div class="row">
        <button class="primary" id="save" type="button" disabled>Save Notes</button>
      </div>
      <div id="status">&nbsp;</div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
