<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Frame Maker</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Frame Maker</h1>
        <div class="sub" id="sub">&nbsp;</div>
      </header>
      <div class="row">
        <label>Colour <input id="color" type="color" value="#ffffff" /></label>
        <label class="grow">Width, percent of the short side <input id="width" type="number" min="1" max="25" step="0.5" value="4" /></label>
      </div>
      <div class="row">
        <button class="primary" id="add" type="button">Add Frame</button>
      </div>
      <div id="status">&nbsp;</div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
