<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Rating Desk</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Rating Desk</h1>
        <div class="sub" id="sub">&nbsp;</div>
      </header>
      <div class="row" id="actions">
        <button class="small" data-rating="0" type="button">0</button>
        <button class="small" data-rating="1" type="button">1</button>
        <button class="small" data-rating="2" type="button">2</button>
        <button class="small" data-rating="3" type="button">3</button>
        <button class="small" data-rating="4" type="button">4</button>
        <button class="small" data-rating="5" type="button">5</button>
        <button class="small" data-flag="pick" type="button">Pick</button>
        <button class="small" data-flag="reject" type="button">Reject</button>
        <button class="small" data-flag="none" type="button">Unflag</button>
      </div>
      <ul class="list" id="photos"><li class="empty">Reading the selection</li></ul>
      <div id="status">&nbsp;</div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
