<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Keyword Stamp</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Keyword Stamp</h1>
        <div class="sub" id="sub">&nbsp;</div>
      </header>
      <div class="row">
        <input class="grow" id="keyword" placeholder="Keyword, levels with | (Places|Bristol)" />
        <button class="primary" id="stamp" type="button">Stamp</button>
      </div>
      <ul class="list" id="favourites"><li class="empty">Reading your keywords</li></ul>
      <div id="status">&nbsp;</div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
