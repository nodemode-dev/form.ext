<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Profile Snapshots</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Profile Snapshots</h1>
        <div class="sub" id="sub">&nbsp;</div>
      </header>
      <div class="row">
        <input class="grow" id="name" placeholder="Profile name, empty for a dated one" />
        <button class="primary" id="save" type="button">Save Snapshot</button>
      </div>
      <ul class="list" id="profiles"><li class="empty">Reading the profiles</li></ul>
      <div id="status">&nbsp;</div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
