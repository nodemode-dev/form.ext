<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Layer Strip</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Layer Strip</h1>
        <div class="sub" id="sub">&nbsp;</div>
      </header>
      <div class="row">
        <input class="grow" id="comment" placeholder="Marker comment" />

      </div>
      <ul class="list" id="layers"><li class="empty">Reading the composition</li></ul>
      <div id="status">&nbsp;</div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
