<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>form.ext</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    html, body { background: #0a0a0a; margin: 0; padding: 0; height: 100%; overflow: hidden; }
    html[data-theme="light"], html[data-theme="light"] body { background: #ecebe6; }
    #app { visibility: hidden; }
    body.app-ready #app { visibility: visible; }
  </style>
  <script>
(function () {
  var mode = 'dark';
  try {
    var saved = localStorage.getItem('formext.theme');
    if (saved === 'light' || saved === 'dark') mode = saved;
  } catch (e) {}
  var root = document.documentElement;
  root.setAttribute('data-theme', mode);
  root.style.colorScheme = mode;
  if (window.__TAURI_INTERNALS__ && /Mac/.test(navigator.platform)) {
    root.classList.add('has-native-menus', 'has-overlay-titlebar');
  }
  try {
    if (!root.hasAttribute('data-demo') && sessionStorage.getItem('formext.demo') === 'studio') root.setAttribute('data-demo', 'studio');
  } catch (e) {}
  try {
    var pane = (location.hash || '').replace(/^#\/?/, '').split(/[/?]/)[0] || localStorage.getItem(root.getAttribute('data-demo') === 'studio' ? 'formext.demo.pane' : 'formext.pane') || 'home';
    var start = { home: 1, new: 1, docs: 1, recent: 1 };
    root.setAttribute('data-layout', start[pane] ? 'start' : 'studio');
    if (localStorage.getItem('formext.rail') === '1') root.setAttribute('data-rail', '1');
  } catch (e) {
    root.setAttribute('data-layout', 'start');
  }
})();
  </script>
</head>
<body>
  <div id="app">
    <header class="fx-title" data-tauri-drag-region>
      <nav class="fx-menubar" aria-label="Main menu"></nav>
      <div class="fx-tb-doc ellipsis" data-tauri-drag-region></div>
      <button class="fx-tb-app" type="button" data-action="home-name" aria-label="Home" title="Home">form.ext</button>
      <div class="fx-tb-r">
        <button class="fx-tb-demo" type="button" data-action="demo-leave" title="Leave the demo: its sample projects go away and your own projects come back"><b>Demo</b><span>Sample projects, not yours</span><em>Leave</em></button>
        <button class="fx-tb-btn" type="button" data-action="home" aria-label="Home" title="Home"></button>
        <button class="fx-tb-btn" type="button" data-action="palette" aria-label="Commands" title="Commands"></button>
        <button class="fx-tb-btn" type="button" data-action="theme" aria-label="Theme"></button>
        <button class="fx-tb-btn" type="button" data-action="settings" aria-label="Preferences" title="Preferences"></button>
      </div>
    </header>
    <aside class="fx-sidebar">
      <div class="fx-side-brand"></div>
      <nav class="fx-side-nav" aria-label="Start"></nav>
      <div class="fx-side-foot"></div>
      <button class="fx-edge" type="button" aria-label="Collapse or expand the sidebar" title="Collapse or expand the sidebar"></button>
    </aside>
    <main class="fx-main"></main>
    <footer class="fx-status">
      <button class="item btn ghost sm" type="button" data-status="engine" data-state="wait"><span class="led"></span><span>Engine starting</span></button>
      <span class="item" data-status="project"><span class="ellipsis">No project</span></span>
      <span class="item ellipsis" data-status="path">&nbsp;</span>
      <span class="item" data-status="pos">&nbsp;</span>
      <span class="item" data-status="lang">&nbsp;</span>
      <span class="item" data-status="state">&nbsp;</span>
      <span class="item right" data-status="host">&nbsp;</span>
      <span class="item" data-status="problems">&nbsp;</span>
      <span class="item" data-status="version">form.ext</span>
    </footer>
  </div>
  <div class="fx-scrim"></div>
  <form class="fx-dialog" role="dialog" aria-modal="true" novalidate>
    <div class="fx-dialog-head"></div>
    <div class="fx-dialog-body"></div>
    <div class="fx-dialog-foot"><button class="btn" type="button" data-role="cancel">Cancel</button><button class="btn primary" type="submit" data-role="ok">OK</button></div>
  </form>
  <div class="fx-palette" role="dialog" aria-label="Command palette">
    <div class="fx-palette-input"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="text" spellcheck="false" autocomplete="off" aria-label="Search"></div>
    <ul class="fx-palette-list" role="listbox"></ul>
  </div>
  <div class="fx-toasts" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
